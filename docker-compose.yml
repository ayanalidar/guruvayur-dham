# ============================================================================
# Guruvayur Dham — VPS Docker Compose
# ============================================================================
# Runs 3 services:
#   1. postgres — PostgreSQL 16 database (persistent volume)
#   2. app      — Next.js app (built from Dockerfile, connects to postgres)
#   3. caddy    — Reverse proxy + auto HTTPS (replaces Vercel's SSL)
#
# Usage:
#   1. Copy .env.example to .env, fill in values
#   2. Set DOMAIN in .env (e.g. guruvayurdham.com)
#   3. docker compose up -d --build
#   4. Run migrations: docker compose exec app npx prisma db push
#   5. Seed: docker compose exec app bun run scripts/seed.ts
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: guruvayur-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guruvayur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guruvayur_password}
      POSTGRES_DB: ${POSTGRES_DB:-guruvayur_dham}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # Only expose locally; Caddy handles external traffic
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guruvayur} -d ${POSTGRES_DB:-guruvayur_dham}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - guruvayur-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Pass DATABASE_URL at build time so Prisma can generate the client
        DATABASE_URL: postgresql://${POSTGRES_USER:-guruvayur}:${POSTGRES_PASSWORD:-guruvayur_password}@postgres:5432/${POSTGRES_DB:-guruvayur_dham}?schema=public
    container_name: guruvayur-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Override DATABASE_URL at runtime to point to the postgres service
      DATABASE_URL: postgresql://${POSTGRES_USER:-guruvayur}:${POSTGRES_PASSWORD:-guruvayur_password}@postgres:5432/${POSTGRES_DB:-guruvayur_dham}?schema=public
      NODE_ENV: production
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      CRON_SECRET: ${CRON_SECRET}
    volumes:
      # Persistent volume for uploaded images (local filesystem storage)
      - uploads_data:/app/public/uploads
    ports:
      - "127.0.0.1:3000:3000"  # Only expose locally; Caddy handles external traffic
    networks:
      - guruvayur-net

  caddy:
    image: caddy:2-alpine
    container_name: guruvayur-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-guruvayurdham.com}
    depends_on:
      - app
    networks:
      - guruvayur-net

  # ---- Review funnel cron (runs every 15 min) ----
  cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guruvayur-cron
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guruvayur}:${POSTGRES_PASSWORD:-guruvayur_password}@postgres:5432/${POSTGRES_DB:-guruvayur_dham}?schema=public
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      NODE_ENV: production
      CRON_SECRET: ${CRON_SECRET}
    # Override the default CMD to run a cron loop instead of the web server
    command: >
      sh -c "
        echo 'Starting review-funnel cron (every 15 min)...';
        while true; do
          echo \"[$(date)] Running review funnel...\";
          wget --post-data='' -qO- http://app:3000/api/reviews/checkout-funnel 2>&1 || true;
          sleep 900;
        done
      "
    networks:
      - guruvayur-net

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  guruvayur-net:
    driver: bridge
